<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf8ef">
<meta name="description" content="2049 – 2048 במהדורה משוכללת, עם מוח שמבין את הלוח">
<title>2049</title>
<link rel="icon" type="image/png" sizes="64x64" href="icon_64.png">
<link rel="apple-touch-icon" href="icon_256.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="2049">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* the classic 2048 palette, kept exactly */
    --bg:#faf8ef; --board:#bbada0; --cell:#cdc1b4; --ink:#776e65;
    --light:#f9f6f2; --btn:#8f7a66; --accent:#ed7c42; --card:#f3ebe0;
    --muted:#a39587; --line:rgba(119,110,101,.12); --green:#3caa6e;
    --r-lg:16px; --r-md:12px; --r-sm:9px;
    --shadow:0 1px 2px rgba(80,60,40,.06),0 6px 18px rgba(80,60,40,.08);
    --font:'Rubik','Segoe UI',Arial,'Helvetica Neue',sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:var(--font);-webkit-font-smoothing:antialiased;}
  body{min-height:100vh;min-height:100dvh;
    background:radial-gradient(120% 80% at 50% 0%,#fdfcf7 0%,var(--bg) 55%,#f4f0e4 100%) fixed;}
  button{font-family:inherit;cursor:pointer;border:none;color:inherit;}
  button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .hidden{display:none !important;}

  .screen{max-width:520px;margin:0 auto;position:relative;
    padding:max(16px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom));
    min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;}
  .screen.game{justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none;}

  /* ---------- header ---------- */
  .top{display:flex;justify-content:space-between;align-items:center;gap:12px;}
  .brand{display:flex;flex-direction:column;line-height:1;}
  .title{font-size:clamp(46px,13vw,64px);font-weight:800;letter-spacing:-1px;color:var(--ink);}
  .scores{display:flex;gap:8px;}
  .scorebox{position:relative;background:var(--board);border-radius:var(--r-sm);
    padding:7px 14px 8px;text-align:center;color:var(--light);min-width:78px;
    box-shadow:inset 0 -2px 0 rgba(0,0,0,.06);}
  .scorebox .lbl{font-size:11px;font-weight:600;letter-spacing:.6px;color:#eee4da;}
  .scorebox .val{font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;}
  .scorebox .plus{position:absolute;inset-inline:0;top:22px;font-size:20px;font-weight:700;
    color:rgba(119,110,101,.9);pointer-events:none;animation:plus .65s ease-in forwards;}
  @keyframes plus{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-38px)}}

  .toolbar{display:flex;justify-content:space-between;align-items:center;margin:16px 0 14px;gap:8px;}
  .btn{background:var(--btn);color:var(--light);padding:10px 18px;border-radius:var(--r-sm);
    font-size:15px;font-weight:700;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12);
    transition:transform .08s ease,filter .15s ease;}
  .btn:hover{filter:brightness(1.06);} .btn:active{transform:translateY(1px);}
  .tools{display:flex;gap:8px;align-items:center;}
  .sizesel{display:flex;align-items:center;background:var(--board);border-radius:var(--r-sm);
    color:var(--light);font-weight:700;font-size:15px;overflow:hidden;}
  .sizesel button{background:none;color:var(--light);width:30px;height:40px;display:flex;
    align-items:center;justify-content:center;opacity:.85;}
  .sizesel button:hover{opacity:1;background:rgba(255,255,255,.08);}
  .sizesel span{min-width:38px;text-align:center;font-variant-numeric:tabular-nums;direction:ltr;}
  .iconbtn{background:var(--board);color:var(--light);border-radius:var(--r-sm);width:40px;height:40px;
    display:flex;align-items:center;justify-content:center;}
  .iconbtn:hover{filter:brightness(1.06);}
  .iconbtn svg,.sizesel svg{width:18px;height:18px;}

  /* ---------- board ---------- */
  .boardwrap{position:relative;margin:0 auto;width:100%;
    max-width:min(100%, calc(100dvh - 300px));min-width:min(100%,260px);}
  #board{position:relative;background:var(--board);border-radius:var(--r-lg);
    padding:var(--gap);direction:ltr;touch-action:none;aspect-ratio:1/1;
    box-shadow:0 10px 30px rgba(120,100,80,.18),inset 0 0 0 1px rgba(255,255,255,.06);}
  .grid-bg{position:absolute;inset:var(--gap);}
  .cell{position:absolute;left:0;top:0;background:rgba(238,228,218,.35);border-radius:var(--r-sm);}
  #tiles{position:absolute;inset:var(--gap);}
  .tile{position:absolute;left:0;top:0;border-radius:var(--r-sm);display:flex;align-items:center;
    justify-content:center;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;
    transition:transform 110ms ease-in-out;z-index:2;}
  .tile .in{width:100%;height:100%;border-radius:inherit;display:flex;align-items:center;
    justify-content:center;}
  .tile.new .in{animation:appear .2s ease .1s backwards;}
  .tile.merged{z-index:3;} .tile.merged .in{animation:pop .2s ease .1s backwards;}
  .tile.ghost{z-index:1;transition:transform 110ms ease-in-out,opacity 110ms ease-in;}
  .tile.ghost .in{transition:scale 110ms ease-in;}
  @keyframes appear{0%{opacity:0;scale:0}100%{opacity:1;scale:1}}
  @keyframes pop{0%{scale:0}50%{scale:1.2}100%{scale:1}}

  .overlay{position:absolute;inset:0;border-radius:var(--r-lg);z-index:20;display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:rgba(250,248,239,.8);animation:fade .6s ease .25s backwards;}
  .overlay h2{font-size:clamp(30px,8vw,44px);margin:0;font-weight:800;color:var(--ink);}
  .overlay .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .overlay .hint{font-size:13px;color:var(--muted);}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .btn.accent{background:var(--accent);}

  /* ---------- coach ---------- */
  .tiparea{min-height:58px;display:flex;align-items:flex-start;justify-content:center;padding-top:12px;}
  .tip{display:flex;align-items:center;gap:10px;max-width:100%;background:#fbefdc;
    border-radius:var(--r-md);padding:9px 14px;font-size:14px;font-weight:500;line-height:1.35;
    box-shadow:var(--shadow);animation:tipin .22s ease;}
  .tip .dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--accent);}
  .tip.praise{background:#e2f2e6;} .tip.praise .dot{background:var(--green);}
  .tip.info{background:#f1ebe2;} .tip.info .dot{background:var(--btn);}
  .tip .arrow{font-weight:700;unicode-bidi:isolate;}
  @keyframes tipin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

  .bottombar{display:flex;justify-content:space-between;align-items:center;gap:10px;
    color:var(--muted);font-size:13px;}
  .icons{display:flex;gap:8px;}
  .bicon{background:rgba(205,193,180,.7);border-radius:var(--r-sm);width:38px;height:32px;display:flex;
    align-items:center;justify-content:center;color:var(--ink);position:relative;z-index:6;}
  .bicon svg{width:18px;height:18px;} .bicon.off{color:var(--muted);}

  /* ---------- settings / refuge ---------- */
  .schead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .schead h1{font-size:26px;font-weight:800;margin:0;}
  .scard{background:var(--card);border-radius:var(--r-md);padding:12px 14px;margin-bottom:10px;
    display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:var(--shadow);}
  .scard .lbl{font-size:15px;font-weight:600;}
  .seg{display:inline-flex;background:rgba(205,193,180,.55);border-radius:10px;padding:3px;gap:2px;flex:none;}
  .seg button{background:none;padding:7px 12px;border-radius:8px;font-size:14px;font-weight:600;
    color:var(--ink);white-space:nowrap;transition:background .15s ease,color .15s ease;}
  .seg button.on{background:var(--accent);color:#fff;box-shadow:0 1px 3px rgba(150,70,20,.25);}
  .seg .ltr{direction:ltr;unicode-bidi:isolate;}
  .resetrow{display:flex;gap:10px;margin:6px 0 4px;}
  .resetrow button{flex:1;background:rgba(205,193,180,.55);padding:11px;border-radius:var(--r-sm);
    font-size:13px;font-weight:600;}
  .prefbtn{display:block;margin:20px auto 4px;}
  .prefhint{text-align:center;color:var(--muted);font-size:12px;}
  .aboutcard{background:#f6f0e6;border-radius:var(--r-lg);padding:14px;margin-top:18px;box-shadow:var(--shadow);}
  .ghbtn{display:block;width:100%;text-align:center;text-decoration:none;}
  .byline{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;
    color:var(--muted);margin-top:12px;}
  .byline a{color:var(--accent);text-decoration:none;font-weight:700;}
  .byline img{width:24px;height:24px;border-radius:50%;}
  .ver{text-align:center;font-size:12px;color:var(--muted);margin-top:14px;direction:ltr;}

  .refsub{color:var(--muted);font-size:13px;margin:-8px 0 14px;}
  .modesel{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
  .modesel .lbl{font-weight:700;margin-inline-end:4px;white-space:nowrap;}
  .modesel .name{flex:1;background:var(--card);border-radius:var(--r-sm);padding:10px;text-align:center;
    font-weight:700;box-shadow:var(--shadow);}
  .modesel button{width:40px;height:40px;border-radius:var(--r-sm);background:var(--btn);color:var(--light);
    display:flex;align-items:center;justify-content:center;}
  .checkrow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);
    border-radius:var(--r-md);padding:10px 14px;margin-bottom:8px;font-size:14px;box-shadow:var(--shadow);}
  .switch{flex:none;width:42px;height:24px;border-radius:12px;background:rgba(205,193,180,.9);position:relative;
    transition:background .15s ease;}
  .switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;
    border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:inset-inline-start .15s ease;}
  .switch.on{background:var(--accent);} .switch.on::after{inset-inline-start:21px;}
  .sect{font-weight:700;margin:16px 2px 8px;}
  .cheatrow{background:var(--card);border-radius:var(--r-md);padding:11px 14px;margin-bottom:8px;display:flex;
    justify-content:space-between;align-items:center;gap:12px;box-shadow:var(--shadow);}
  .cheatrow .info{flex:1;min-width:0;}
  .cheatrow .t{font-weight:700;font-size:15px;}
  .cheatrow .tag{font-size:11px;font-weight:700;margin-inline-start:8px;padding:2px 7px;border-radius:6px;
    background:rgba(237,124,66,.12);color:var(--accent);vertical-align:2px;}
  .cheatrow .tag.tap{background:rgba(60,170,110,.12);color:#3a8f5f;}
  .cheatrow .d{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.35;}
  .keybox{flex:none;min-width:92px;background:rgba(205,193,180,.55);border-radius:var(--r-sm);padding:9px 10px;
    text-align:center;font-size:13px;font-weight:700;}
  .keybox.listening{background:var(--accent);color:#fff;} .keybox.empty{color:var(--muted);}
  .clicknote{text-align:center;color:var(--muted);font-size:12px;margin-top:10px;}

  /* ---------- dialogs, dot, toast ---------- */
  .dim{position:fixed;inset:0;background:rgba(40,32,26,.6);z-index:100;
    display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s ease;}
  .dialog{background:var(--bg);border-radius:20px;padding:24px 22px 20px;max-width:400px;width:100%;
    text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25);border-top:5px solid var(--accent);}
  .dialog.green{border-top-color:var(--green);}
  .dialog h3{margin:.1em 0 .4em;font-size:22px;font-weight:800;}
  .dialog p{margin:.4em 0;line-height:1.45;}
  .dialog .accent{color:var(--accent);font-weight:700;}
  .dialog .btns{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap;}
  .dialog .check{width:46px;height:46px;border-radius:50%;background:var(--green);color:#fff;display:flex;
    align-items:center;justify-content:center;font-size:24px;margin:0 auto 8px;}
  .dialog .picks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 4px;}
  .dialog .pick{background:var(--card);padding:12px 8px;border-radius:var(--r-sm);font-weight:600;font-size:14px;}
  .btn.green{background:var(--green);}
  #cornerdot{position:fixed;top:5px;right:5px;width:6px;height:6px;border-radius:50%;opacity:0;
    pointer-events:none;z-index:200;transition:opacity .2s ease;}
  .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--btn);color:var(--light);
    padding:12px 20px;border-radius:var(--r-md);z-index:150;text-align:center;font-size:14px;
    box-shadow:0 8px 24px rgba(0,0,0,.2);white-space:pre-line;animation:tipin .2s ease;max-width:90vw;}

  /* invisible assist zones (touch devices): the screen's corners, under the controls */
  #touchzones{position:absolute;inset:0;pointer-events:none;z-index:5;}
  #touchzones .tz{position:absolute;width:22%;height:16%;pointer-events:auto;}
  #touchzones .tz[data-zone="tl"]{top:0;left:0;} #touchzones .tz[data-zone="tr"]{top:0;right:0;}
  #touchzones .tz[data-zone="bl"]{bottom:0;left:0;} #touchzones .tz[data-zone="br"]{bottom:0;right:0;}
  .top,.toolbar,.bottombar{position:relative;z-index:6;}
  .top>*,.toolbar>*{position:relative;z-index:6;}

  @media (max-height:640px){ .toolbar{margin:10px 0 10px;} .tiparea{min-height:50px;} }
  @media (prefers-reduced-motion:reduce){
    .tile,.tile.ghost{transition:none;} .tile .in,.overlay,.tip,.scorebox .plus{animation:none !important;}
  }
</style>
</head>

const CFG_KEY = "cfg2049", GAME_KEY = "game2049", JS_CONFIG_VERSION = 3;
function defaultCfg(){
  return {config_version:3, grid_size:4, language:"he", active_profile:0, highscore:0, sound:true,
    infinite:true, show_tips:false, persist_cheats:false, count_cheats_in_best:false, difficulty:"normal",
    profiles:[{map:{}},{map:{force_4:"Shift"}},{map:{clean_stuck:"Shift",undo:"Control"}},
      {map:{force_4:"Shift",clean_stuck:"c",undo:"z",spawn_corner:"Alt",smart_spawn:"x"}}]};
}
function store(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function load(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function sanitize(c){
  const d = defaultCfg(), ok = (k, f) => { if(!f(c[k])) c[k] = d[k]; };
  ok("grid_size", v => [4,5,6].includes(v)); ok("language", v => v in STRINGS);
  ok("difficulty", v => v in DIFFICULTY_EVIL_P);
  ["sound","infinite","show_tips","persist_cheats","count_cheats_in_best"].forEach(k => ok(k, v => typeof v==="boolean"));
  ok("highscore", v => Number.isInteger(v) && v >= 0);
  if(!Array.isArray(c.profiles) || !c.profiles.length || !c.profiles.every(p => p && typeof p.map==="object" && p.map))
    c.profiles = d.profiles;
  for(const p of c.profiles) for(const a of Object.keys(p.map)){
    const v = p.map[a];
    if(!ACTIONS.includes(a) || typeof v!=="string" || !v || v.startsWith("__")) delete p.map[a];
  }
  ok("active_profile", v => Number.isInteger(v) && v >= 0 && v < c.profiles.length);
  return c;
}
function loadCfg(){
  let c = defaultCfg();
  const s = load(CFG_KEY);
  if(s && typeof s==="object"){
    const oldVer = s.config_version || 1;
    Object.assign(c, s);
    c.config_version = JS_CONFIG_VERSION;
    if(oldVer < JS_CONFIG_VERSION){ c.profiles = defaultCfg().profiles; c.active_profile = 0; }
  }
  c = sanitize(c);
  // like every desktop launch: unless kept on purpose, each visit starts clean
  if(!c.persist_cheats){ c.profiles = defaultCfg().profiles; c.active_profile = 0; }
  store(CFG_KEY, c);
  return c;
}
const saveCfg = c => store(CFG_KEY, c);

// ============================================================
//  Board (game rules + slide bookkeeping; the brain does the thinking)
// ============================================================
class Board{
  constructor(n){ this.size=n; this.grid=Array.from({length:n},()=>Array(n).fill(0)); this.score=0; }
  clone(){ const b=new Board(this.size); b.grid=this.grid.map(r=>r.slice()); b.score=this.score; return b; }
  emptyCells(){ const o=[]; for(let r=0;r<this.size;r++) for(let c=0;c<this.size;c++) if(!this.grid[r][c]) o.push([r,c]); return o; }
  maxTile(){ let m=0; for(const row of this.grid) for(const v of row) if(v>m) m=v; return m; }
  ranks(){ return B.toRanks(this.grid).b; }
  spawn(forceValue=null, preferEdge=false, evil=false, at=null){
    let cells=this.emptyCells(); if(!cells.length) return null;
    if(at && cells.some(([r,c])=>r===at[0]&&c===at[1])){
      const v=forceValue||2; this.grid[at[0]][at[1]]=v; return [at[0],at[1],v];
    }
    if(preferEdge){ const n=this.size, e=cells.filter(([r,c])=>r===0||r===n-1||c===0||c===n-1); if(e.length) cells=e; }
    const val=forceValue?forceValue:(Math.random()<0.1?4:2);
    const [r,c]=(evil&&cells.length>1)?this._evilCell(cells,val):cells[Math.floor(Math.random()*cells.length)];
    this.grid[r][c]=val; return [r,c,val];
  }
  adjacentPairs(){ const n=this.size; let k=0;
    for(let r=0;r<n;r++) for(let c=0;c<n;c++){ const v=this.grid[r][c]; if(!v) continue;
      if(c+1<n&&this.grid[r][c+1]===v) k++; if(r+1<n&&this.grid[r+1][c]===v) k++; } return k; }
  maxInCorner(){ const n=this.size, m=this.maxTile();
    return [this.grid[0][0],this.grid[0][n-1],this.grid[n-1][0],this.grid[n-1][n-1]].includes(m); }
  _evilCell(cells,val){            // the difficulty's adversary (unchanged, = 2049.py)
    let best=null, bestCells=[];
    for(const [r,c] of cells){
      const b=this.clone(); b.grid[r][c]=val; let reply=null;
      for(const d of ["left","right","up","down"]){ const b2=b.clone();
        if(b2.move(d).changed){ const q=6*b2.emptyCells().length+2*b2.adjacentPairs()+(b2.maxInCorner()?2:0);
          reply=reply===null?q:Math.max(reply,q); } }
      if(reply===null) reply=-1e9;
      if(best===null||reply<best){ best=reply; bestCells=[[r,c]]; } else if(reply===best) bestCells.push([r,c]);
    }
    return bestCells[Math.floor(Math.random()*bestCells.length)];
  }
  _lineMoves(line){
    const ent=[]; line.forEach((v,i)=>{ if(v) ent.push([v,i]); });
    const out=Array(line.length).fill(0), moves=[]; let dest=0,i=0;
    while(i<ent.length){
      if(i+1<ent.length&&ent[i+1][0]===ent[i][0]){ out[dest]=ent[i][0]*2; moves.push([dest,[ent[i][1],ent[i+1][1]],true,ent[i][0]*2]); i+=2; }
      else { out[dest]=ent[i][0]; moves.push([dest,[ent[i][1]],false,ent[i][0]]); i+=1; }
      dest++;
    }
    return [out,moves];
  }
  move(dir){
    const n=this.size; let changed=false, gain=0; const anims=[], merges=[];
    for(let k=0;k<n;k++){
      const pos = j => dir==="left"?[k,j]:dir==="right"?[k,n-1-j]:dir==="up"?[j,k]:[n-1-j,k];
      const line=[]; for(let j=0;j<n;j++){ const [r,c]=pos(j); line.push(this.grid[r][c]); }
      const [out,moves]=this._lineMoves(line);
      for(const [dest,srcs,merged,val] of moves){
        for(const s of srcs) anims.push({from:pos(s),to:pos(dest),value:line[s],merged,newValue:val});
        if(merged){ gain+=val; merges.push([...pos(dest),val]); }
      }
      for(let j=0;j<n;j++){ const [r,c]=pos(j); if(this.grid[r][c]!==out[j]) changed=true; this.grid[r][c]=out[j]; }
    }
    if(changed) this.score+=gain;
    return {changed,anims,merges,gain};
  }
  canMove(){ return B.canMove(this.ranks(), this.size); }
}

class Game{
  constructor(){
    this.cfg=loadCfg();
    this.app=document.getElementById("app");
    this.dot=document.getElementById("cornerdot");
    this.state="game"; this.capturing=null; this.cheatDirty=false;
    this.heldKeys=new Set(); this.animating=false; this.audioCtx=null;
    this.coach=new B.Coach(); this.boardTag=0; this.coachTag=0; this.pending=new Map();
    this.analysis=null; this.tip=null; this.tipSince=0; this.armedClean=null;
    this.moveNo=0; this.history=[];
    if(!this.restoreGame()) this.newGame(false);
    this.bindGlobal();
    this.render();
    setInterval(()=>this.tickTip(), 250);
  }
  L(k){ return STRINGS[this.cfg.language][k]; }
  isRTL(){ return this.cfg.language==="he"; }
  profile(){ return this.cfg.profiles[this.cfg.active_profile]; }
  keyForAction(a){ return this.profile().map[a] || null; }
  activeCheatOn(){ return Object.values(this.profile().map).some(v=>typeof v==="string"&&v.length>0); }

  // ---------- game flow ----------
  newGame(render=true){
    this.finishNow();
    this.board=new Board(this.cfg.grid_size);
    const s1=this.board.spawn(), s2=this.board.spawn();
    this.history=[]; this.won=false; this.keepGoing=false; this.cheatUsed=false;
    this.armedClean=null; this.moveNo=0; this.fresh=[s1,s2];
    this.boardChanged("new"); this.saveGame();
    if(render) this.render();
  }
  restoreGame(){
    const st=load(GAME_KEY);
    try{
      const n=st.size, g=st.grid;
      if(n!==this.cfg.grid_size || g.length!==n || !g.every(r=>r.length===n &&
         r.every(v=>Number.isInteger(v)&&v>=0&&(v&(v-1))===0))) return false;
      const b=new Board(n); b.grid=g.map(r=>r.slice()); b.score=st.score|0;
      if(!b.canMove() || !b.maxTile()) return false;
      this.board=b; this.history=[]; this.won=!!st.won; this.keepGoing=!!st.keepGoing;
      this.cheatUsed=!!st.cheat; this.moveNo=st.moves|0; this.armedClean=null; this.fresh=null;
      this.boardChanged("new");
      return true;
    }catch(e){ return false; }
  }
  saveGame(){
    if(!this.board.canMove()){ try{ localStorage.removeItem(GAME_KEY); }catch(e){} return; }
    store(GAME_KEY,{v:1,size:this.board.size,grid:this.board.grid,score:this.board.score,won:this.won,
      keepGoing:this.keepGoing,cheat:this.cheatUsed,moves:this.moveNo});
  }
  updateHighscore(){
    const cheating=this.cheatUsed||this.activeCheatOn();
    if(cheating && !this.cfg.count_cheats_in_best) return;
    if(this.board.score>this.cfg.highscore){ this.cfg.highscore=this.board.score; saveCfg(this.cfg); }
  }
  heldParams(){
    let fv=null, pe=false, smart=false;
    const held=a=>{ const k=this.keyForAction(a); return !!k && this.heldKeys.has(k); };
    if(held("force_2")) fv=2; if(held("force_4")) fv=4; if(held("spawn_corner")) pe=true; if(held("smart_spawn")) smart=true;
    if(IS_TOUCH && this._touchArm){ const t=this._touchArm;
      if(t.force_2) fv=2; if(t.force_4) fv=4; if(t.spawn_corner) pe=true; if(t.smart_spawn) smart=true; }
    if(fv!==null||pe||smart) this.cheatUsed=true;
    return [fv,pe,smart];
  }
  rollEvil(){ const p=DIFFICULTY_EVIL_P[this.cfg.difficulty]||0; return p>0 && Math.random()<p; }

  finishNow(){
    // the next key during a slide settles it at once: no move is ever dropped
    if(this.animating){ clearTimeout(this._finTimer); this._finTimer=null; this.finalizeMove(); }
  }
  handleMove(dir){
    if(this.state!=="game") return;
    this.finishNow();
    if(this.won && !this.keepGoing && !this.cfg.infinite) return;
    const probe=this.board.clone(), pr=probe.move(dir);
    if(!pr.changed) return;
    const prev=this.board.clone(); let cheated=false, ghost=null;
    const target=this.armedTarget(); this.armedClean=null;
    if(target){
      const [r,c]=target, a=pr.anims.find(x=>x.from[0]===r&&x.from[1]===c);
      ghost={from:[r,c],to:a?a.to:[r,c],value:this.board.grid[r][c],merged:false,ghost:true};
      this.board.grid[r][c]=0; this.cheatUsed=true; cheated=true;
    }
    const res=this.board.move(dir);
    if(ghost) res.anims.unshift(ghost);
    this.history.push(prev); if(this.history.length>40) this.history.shift();
    let [fv,pe,smart]=this.heldParams(); cheated=cheated||fv!==null||pe||smart;
    if(IS_TOUCH) this.clearTouchArm();
    let at=null;
    if(smart){ const ch=this.smartChoice(fv,pe); at=ch[0]; fv=ch[1]; }
    const n=this.board.size, moved=new Map();
    for(const a of res.anims) if(!a.ghost) moved.set(a.from[0]*n+a.from[1],[a.to[0]*n+a.to[1],a.merged]);
    this.pendingMove={spawn:[fv,pe,at], merges:res.merges, gain:res.gain, dir:DIR_OF[dir], moved, cheated};
    this.animating=true;
    this.animateSlide(res.anims);
    this._finTimer=setTimeout(()=>{ this._finTimer=null; this.finalizeMove(); },120);
  }
  smartChoice(fv,pe){
    const n=this.board.size; let cells=this.board.emptyCells();
    if(pe){ const e=cells.filter(([r,c])=>r===0||r===n-1||c===0||c===n-1); if(e.length) cells=e; }
    if(!cells.length) return [null,fv];
    const ranks=fv?[Math.round(Math.log2(fv))]:[1,2];
    const pick=B.bestSpawn(this.board.ranks(),n,ranks,cells.map(([r,c])=>r*n+c));
    if(!pick) return [null,fv];
    return [[Math.floor(pick[0]/n),pick[0]%n],Math.pow(2,pick[1])];
  }
  finalizeMove(){
    const pm=this.pendingMove; this.pendingMove=null; this.animating=false;
    if(!pm) return;
    const [fv,pe,at]=pm.spawn;
    const spawned=this.board.spawn(fv,pe,at===null&&this.rollEvil(),at);
    this.updateHighscore();
    if(pm.merges.length){ let hv=0; for(const m of pm.merges) hv=Math.max(hv,m[2]); this.playMerge(hv); }
    else this.playSpawn();
    if(!this.won && this.board.maxTile()>=2048){ this.won=true; this.playWin(); if(this.cfg.infinite) this.keepGoing=true; }
    this.moveNo++;
    this.fresh=spawned?[spawned]:null; this.merged=pm.merges;
    this.boardChanged(["move",pm.dir,pm.moved,pm.cheated]);
    this.saveGame();
    if(this.state!=="game") return;
    if(this.overlayKind()) this.render();
    else { this.layoutTiles(); this.updateScore(pm.gain); }
  }

  // ---------- the brain (runs once the board has settled) ----------
  boardChanged(how){
    this.boardTag++; this.pending.set(this.boardTag,how); this.analysis=null;
    if(how==="new"){ this.tip=null; this.renderTip(); }
    clearTimeout(this._anaTimer);
    // after the slide + pop: a burst of fast moves becomes one analysis -
    // but never more than 0.4 s after the first unanalysed move: a player
    // who never stops used to get no tip at all, not even a warning
    const now=Date.now();
    if(this.pending.size===1) this._firstPending=now;
    const wait=how==="new"?60:Math.max(0,Math.min(300,400-(now-this._firstPending)));
    this._anaTimer=setTimeout(()=>this.runBrain(), wait);
  }
  runBrain(){
    const tag=this.boardTag, how=this.pending.get(tag); let news=false;
    for(const [t,h] of this.pending){ if(t<tag && h==="new") news=true; }
    const burst=[...this.pending].sort((x,y)=>x[0]-y[0]);
    this.pending.clear();
    if(how===undefined) return;
    const a=B.Analysis.ofGrid(this.board.grid);
    if(how==="new"||news) this.coach.newGame(a);
    else if(burst.length && burst[0][0]===this.coachTag+1 && burst.every(([,h])=>Array.isArray(h))){
      // one move, or a burst: the tiles are followed through every move of it
      let moved=burst[0][1][2]; const dirs=[]; let cheated=false;
      burst.forEach(([,h],i)=>{ if(i) moved=B.composeMoves(moved,h[2]); dirs.push(h[1]); cheated=cheated||!!h[3]; });
      this.coach.onMove(dirs[dirs.length-1],moved,a,cheated,burst.length,dirs);
    }
    else this.coach.resync(a);           // an assist / undo in between
    this.coachTag=tag; this.analysis=a;
    if(this.coach.current!==this.tip && !this.keepTip(this.coach.current,a)){
      this.tip=this.coach.current; this.tipSince=Date.now(); this.renderTip(); }
  }
  // a tip stays readable (3.5 s at least) while it is still true, unless a
  // more urgent one comes - fast play used to flash most tips for < 1.5 s
  keepTip(nw,a){
    const old=this.tip;
    if(!old || Date.now()-this.tipSince>=3500) return false;
    if(nw && nw.prio>old.prio) return false;
    return this.coach.stillTrue(old,a);
  }
  analysisNow(){
    const r=this.board.ranks();
    if(this.analysis && this.analysis.b.every((x,i)=>x===r[i])) return this.analysis;
    return B.Analysis.ofGrid(this.board.grid);
  }
  armedTarget(){
    if(!this.armedClean) return null;
    const [tag,cell]=this.armedClean;
    if(tag===this.boardTag) return cell;
    const p=this.analysisNow().problem();
    return p===null?null:[Math.floor(p/this.board.size),p%this.board.size];
  }
  tickTip(){
    const cur=this.coach.current;
    if(cur!==this.tip && this.analysis && (!this.tip || Date.now()-this.tipSince>=3500)
       && (!cur || this.coach.isValid(cur,this.analysis))){
      this.tip=cur; this.tipSince=Date.now(); this.renderTip(); }
    if(this.tip && Date.now()-this.tipSince>this.tip.maxSecs*1000){ this.coach.dismiss(); this.tip=null; this.renderTip(); }
  }
  tipText(t){
    const p=t.params, f={}, arrow=d=>`<span class="arrow">${ARROWS[d]}</span>`;
    if(p.dir!==undefined) f.dir=arrow(p.dir);
    if(p.bad) f.bad=p.bad.map(arrow).join(" ");
    if(p.value!==undefined) f.value=String(p.value);
    if(p.big!==undefined) f.big=String(p.big);
    if(p.place) f.place=esc(this.L("places")[p.place]||"");
    return esc(this.L(t.key)).replace(/\{(\w+)\}/g,(m,k)=>f[k]!==undefined?f[k]:m);
  }

  // ---------- tap assists: no toast ever, only the corner dot ----------
  signal(ok){
    const d=this.dot; d.style.background=ok?"#8f7a66":"#d69478"; d.style.opacity="1";
    clearTimeout(this._dotT); this._dotT=setTimeout(()=>this.showArmedDot(),260);
  }
  showArmedDot(){ const d=this.dot; d.style.background="#8f7a66"; d.style.opacity=this.armedClean?".55":"0"; }
  doTapAction(action){
    this.finishNow();
    if(action==="undo"){
      if(this.history.length){
        this.board=this.history.pop(); this.cheatUsed=true; this.armedClean=null;
        this.moveNo=Math.max(0,this.moveNo-1); this.fresh=null; this.merged=null;
        this.boardChanged("resync"); this.saveGame(); this.signal(true); this.render();
      } else this.signal(false);
      return;
    }
    if(action==="clean_stuck"){
      const p=this.analysisNow().problem();
      if(p===null){ this.armedClean=null; this.signal(false); return; }
      const n=this.board.size, cell=[Math.floor(p/n),p%n];
      if(!this.board.canMove()){            // nothing left to hide it in: rescue now
        this.history.push(this.board.clone()); this.board.grid[cell[0]][cell[1]]=0;
        this.cheatUsed=true; this.updateHighscore(); this.fresh=null; this.merged=null;
        this.boardChanged("resync"); this.saveGame(); this.render();
      } else this.armedClean=[this.boardTag,cell];
      this.signal(true);
    }
  }

  // ---------- sound ----------
  ensureAudio(){ if(!this.audioCtx){ try{ this.audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    if(this.audioCtx&&this.audioCtx.state==="suspended") this.audioCtx.resume().catch(()=>{}); }
  tone(freqs,dur,vol){
    if(!this.cfg.sound) return; this.ensureAudio(); const ac=this.audioCtx; if(!ac) return;
    const t=ac.currentTime, g=ac.createGain(); g.connect(ac.destination);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    for(const f of freqs){ const o=ac.createOscillator(); o.type="sine"; o.frequency.value=f; o.connect(g); o.start(t); o.stop(t+dur+0.02); }
  }
  playMerge(v){ const sc=[261.63,293.66,329.63,349.23,392,440,493.88,523.25,587.33,659.25,698.46,783.99,880,987.77,1046.5,1174.66,1318.51];
    const b=sc[Math.min(sc.length-1,Math.max(0,Math.round(Math.log2(v))-2))]; this.tone([b,b*1.5],0.12,0.12); }
  playSpawn(){ this.tone([392],0.06,0.05); }
  playWin(){ [523,659,784].forEach((f,i)=>setTimeout(()=>this.tone([f],0.22,0.13),i*90)); }

  // ---------- input ----------
  normKey(k){ return (k==="Shift"||k==="Control"||k==="Alt"||k.length!==1)?k:k.toLowerCase(); }
  bindGlobal(){
    const unlock=()=>{ this.ensureAudio(); ["keydown","pointerdown","touchstart"].forEach(t=>window.removeEventListener(t,unlock)); };
    ["keydown","pointerdown","touchstart"].forEach(t=>window.addEventListener(t,unlock));
    document.addEventListener("keydown",e=>this.onKey(e));
    document.addEventListener("keyup",e=>{
      const k=this.normKey(e.key); this.heldKeys.delete(k);
      if(this.state==="game" && k==="Alt") e.preventDefault();      // no browser menu focus
    });
    window.addEventListener("blur",()=>this.heldKeys.clear());
    window.addEventListener("resize",()=>{ if(this.state==="game") this.layoutTiles(); });
    let sx=0, sy=0, active=false;
    document.addEventListener("touchstart",e=>{
      if(this.state!=="game"||e.touches.length!==1) return;
      if(e.target.closest("button,a,.bicon")) return;
      const t=e.touches[0]; sx=t.clientX; sy=t.clientY; active=true;
    },{passive:true});
    document.addEventListener("touchend",e=>{
      if(!active||this.state!=="game") return; active=false;
      const t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy;
      if(Math.max(Math.abs(dx),Math.abs(dy))<24) return;
      if(Math.abs(dx)>Math.abs(dy)) this.handleMove(dx>0?"right":"left"); else this.handleMove(dy>0?"down":"up");
    },{passive:true});
  }
  onKey(e){
    if(this.capturing!==null && this.state!=="preferences") this.capturing=null;
    if(this.capturing!==null){ e.preventDefault(); this.captureKey(e.key); return; }
    if(document.querySelector(".dim")){
      if(e.key==="Escape"){                // Esc = the safe answer of any dialog
        const pick=document.querySelector("#cfNo,#prOk,#cn,#pkCancel");
        if(pick) pick.click(); else this.closeDialog();
      }
      return;
    }
    if(this.state!=="game") return;
    const k=this.normKey(e.key);
    this.heldKeys.add(k);
    if(k==="Alt"||k==="Tab") e.preventDefault();
    for(const a of ACTIONS){ if(!HOLD.has(a) && this.keyForAction(a)===k){ e.preventDefault(); if(!e.repeat) this.doTapAction(a); return; } }
    const ov=this.overlayKind();
    if(e.key==="Enter"){ if(ov==="over"){ this.newGame(); return; } if(ov==="won"){ this.keepGoing=true; this.saveGame(); this.render(); return; } }
    const dir={ArrowLeft:"left",ArrowRight:"right",ArrowUp:"up",ArrowDown:"down",a:"left",d:"right",w:"up",s:"down"}[e.key.length===1?e.key.toLowerCase():e.key];
    if(dir){ e.preventDefault(); this.handleMove(dir); }
  }

  // ---------- touch assists (invisible corner zones) ----------
  bindTouchZones(){
    document.querySelectorAll("#touchzones .tz").forEach(z=>{
      const zone=z.dataset.zone; let lastTap=0, x0=0, y0=0, moved=false;
      z.addEventListener("touchstart",e=>{
        const t=e.touches[0]; x0=t.clientX; y0=t.clientY; moved=false;
        const holds=this.cheatsForZone(zone,true);
        if(holds.length){ this._touchArm=this._touchArm||{}; holds.forEach(a=>this._touchArm[a]=true); }
      },{passive:true});
      z.addEventListener("touchmove",e=>{ const t=e.touches[0]; if(Math.abs(t.clientX-x0)>18||Math.abs(t.clientY-y0)>18) moved=true; },{passive:true});
      z.addEventListener("touchend",()=>{
        const holds=this.cheatsForZone(zone,true);
        if(holds.length) setTimeout(()=>{ if(this._touchArm) holds.forEach(a=>this._touchArm[a]=false); },60);
        if(moved) return;
        const now=Date.now();
        if(now-lastTap<320){ this.cheatsForZone(zone,false).forEach(a=>this.doTapAction(a)); lastTap=0; } else lastTap=now;
      },{passive:true});
    });
  }
  cheatsForZone(zone,hold){ return ACTIONS.filter(a=>this.profile().map[a]==="zone:"+zone && HOLD.has(a)===hold); }
  clearTouchArm(){ if(this._touchArm) this._touchArm={}; }

  // ---------- dialogs ----------
  toast(text){ document.querySelectorAll(".toast").forEach(t=>t.remove());
    const t=document.createElement("div"); t.className="toast"; t.textContent=text; document.body.appendChild(t);
    setTimeout(()=>t.remove(),3200); }
  closeDialog(){ document.querySelectorAll(".dim").forEach(d=>d.remove()); }
  dialog(html,cls=""){
    this.closeDialog();
    const dim=document.createElement("div"); dim.className="dim";
    dim.innerHTML=`<div class="dialog ${cls}" role="dialog" aria-modal="true">${html}</div>`;
    document.body.appendChild(dim); return dim;
  }
  showConfirm(q,action){ const L=k=>this.L(k);
    const d=this.dialog(`<p style="font-size:17px;font-weight:600">${esc(q)}</p><div class="btns">
      <button class="btn accent" id="cy">${L("yes")}</button><button class="btn" id="cn">${L("no")}</button></div>`);
    d.querySelector("#cy").onclick=()=>{ this.closeDialog(); action(); }; d.querySelector("#cn").onclick=()=>this.closeDialog(); }

  // ============================================================
  //  RENDER
  // ============================================================
  render(){
    const rtl=this.isRTL();
    document.documentElement.dir=rtl?"rtl":"ltr"; document.documentElement.lang=this.cfg.language;
    if(this.state==="game") this.renderGame();
    else if(this.state==="settings") this.renderSettings();
    else this.renderPreferences();
  }
  overlayKind(){
    if(this.animating) return null;
    if(this.won && !this.keepGoing && !this.cfg.infinite) return "won";
    if(!this.board.canMove()) return "over";
    return null;
  }
  renderGame(){
    const L=k=>this.L(k), b=this.board, n=b.size, ov=this.overlayKind();
    let h=`<div class="screen game">
      <div class="top"><div class="brand"><div class="title">2049</div></div>
        <div class="scores"><div class="scorebox" id="scorebox"><div class="lbl">${L("score")}</div><div class="val" id="sval">${b.score}</div></div>
        <div class="scorebox"><div class="lbl">${L("best")}</div><div class="val" id="bval">${Math.max(this.cfg.highscore,b.score)}</div></div></div></div>
      <div class="toolbar"><button class="btn" id="toSettings">${L("settings")}</button>
        <div class="tools"><div class="sizesel"><button id="gridDown" aria-label="-">${ICON.down}</button><span>${n}×${n}</span>
          <button id="gridUp" aria-label="+">${ICON.up}</button></div>
          <button class="iconbtn" id="refresh" title="${L("new_game")}" aria-label="${L("new_game")}">${ICON.refresh}</button></div></div>
      <div class="boardwrap"><div id="board"><div class="grid-bg" id="gridbg" style="grid-template-columns:repeat(${n},1fr)">${'<div class="cell"></div>'.repeat(n*n)}</div><div id="tiles"></div>`;
    if(ov==="won") h+=`<div class="overlay"><h2>${L("you_win")}</h2><div class="btns"><button class="btn accent" id="ovKeep">${L("keep_playing")}</button><button class="btn" id="ovNew">${L("new_game")}</button></div></div>`;
    else if(ov==="over") h+=`<div class="overlay"><h2>${L("game_over")}</h2><div class="btns"><button class="btn accent" id="ovNew">${L("new_game")}</button></div>${IS_TOUCH?"":`<div class="hint">${L("press_new")}</div>`}</div>`;
    h+=`</div></div><div class="tiparea" id="tiparea"></div>
      <div class="bottombar"><div class="icons">
        <button class="bicon ${this.cfg.sound?"":"off"}" id="sndIcon" title="${this.cfg.sound?L("sound_on"):L("sound_off")}" aria-label="${L("sound")}">${this.cfg.sound?ICON.soundOn:ICON.soundOff}</button>
        <button class="bicon" id="modeIcon" title="${this.cfg.infinite?L("mode_inf"):L("mode_tgt")}" aria-label="${L("win_mode")}">${this.cfg.infinite?ICON.inf:ICON.target}</button></div>
        <div>${IS_TOUCH?L("hint_touch"):L("hint_keys")}</div></div>`;
    if(IS_TOUCH) h+=`<div id="touchzones"><div class="tz" data-zone="tl"></div><div class="tz" data-zone="tr"></div><div class="tz" data-zone="bl"></div><div class="tz" data-zone="br"></div></div>`;
    h+=`</div>`;
    this.app.innerHTML=h;
    const $=id=>document.getElementById(id);
    $("toSettings").onclick=()=>{ this.state="settings"; this.render(); };
    $("gridUp").onclick=()=>this.changeGrid(1); $("gridDown").onclick=()=>this.changeGrid(-1);
    $("refresh").onclick=()=>this.newGame();
    $("sndIcon").onclick=()=>{ this.cfg.sound=!this.cfg.sound; saveCfg(this.cfg); this.render(); };
    $("modeIcon").onclick=()=>{ this.cfg.infinite=!this.cfg.infinite; saveCfg(this.cfg); if(this.cfg.infinite) this.keepGoing=true; this.render(); };
    if($("ovNew")) $("ovNew").onclick=()=>this.newGame();
    if($("ovKeep")) $("ovKeep").onclick=()=>{ this.keepGoing=true; this.saveGame(); this.render(); };
    if(IS_TOUCH) this.bindTouchZones();
    this.layoutTiles(); this.renderTip(); this.showArmedDot();
  }
  geometry(){
    const board=document.getElementById("board"); if(!board) return null;
    const n=this.board.size, w=board.clientWidth, gap=Math.max(6,Math.round(w*(n===4?.028:n===5?.022:.018)));
    board.style.setProperty("--gap",gap+"px");
    const inner=w-2*gap, cell=(inner-gap*(n-1))/n, step=cell+gap;
    // every tile and empty cell lands on whole DEVICE pixels, measured from
    // the screen, not from the board: the board itself usually sits at a
    // fraction of a pixel (at 125% it was 0.375 px off), and text and edges
    // drawn between pixels come out soft
    const dpr=window.devicePixelRatio||1, box=board.getBoundingClientRect();
    const ox=(box.left+board.clientLeft+gap)*dpr, oy=(box.top+board.clientTop+gap)*dpr;
    const px=(o,k)=>(Math.round(o+k*step*dpr)-o)/dpr;          // offset inside #tiles
    const size=Math.round(cell*dpr)/dpr;
    const at=(r,c)=>`translate(${px(ox,c)}px,${px(oy,r)}px)`;
    const bg=document.getElementById("gridbg");
    if(bg) [...bg.children].forEach((el,i)=>{ el.style.width=el.style.height=size+"px";
      el.style.transform=at(Math.floor(i/n),i%n); });
    return {cell:size,gap,step,at};
  }
  tileEl(v,r,c,g,cls){
    const t=document.createElement("div"); t.className="tile"+(cls?" "+cls:"");
    t.style.width=t.style.height=g.cell+"px";
    t.style.transform=g.at(r,c);
    const i=document.createElement("div"); i.className="in"; i.textContent=v;
    i.style.background=tileColor(v); i.style.color=tileText(v); i.style.fontSize=tileFont(v,g.cell);
    i.style.boxShadow=tileShadow(v); t.appendChild(i); return t;
  }
  layoutTiles(){
    if(this.state!=="game") return;
    const tiles=document.getElementById("tiles"), g=this.geometry(); if(!tiles||!g) return;
    tiles.innerHTML=""; const n=this.board.size;
    const isFresh=(r,c)=>this.fresh&&this.fresh.some(s=>s&&s[0]===r&&s[1]===c);
    const isMerged=(r,c)=>this.merged&&this.merged.some(m=>m[0]===r&&m[1]===c);
    for(let r=0;r<n;r++) for(let c=0;c<n;c++){ const v=this.board.grid[r][c]; if(!v) continue;
      tiles.appendChild(this.tileEl(v,r,c,g,isFresh(r,c)?"new":isMerged(r,c)?"merged":"")); }
    this.fresh=null; this.merged=null;
  }
  animateSlide(anims){
    if(this.state!=="game") return;
    const tiles=document.getElementById("tiles"), g=this.geometry(); if(!tiles||!g) return;
    tiles.innerHTML=""; const els=[];
    for(const a of anims){ const t=this.tileEl(a.value,a.from[0],a.from[1],g,a.ghost?"ghost":""); tiles.appendChild(t); els.push([t,a]); }
    void tiles.offsetHeight;                 // start the CSS transitions
    for(const [t,a] of els){
      t.style.transform=g.at(a.to[0],a.to[1]);
      if(a.ghost){ t.style.opacity="0"; t.firstChild.style.scale=".5"; }
    }
  }
  updateScore(gain){
    const s=document.getElementById("sval"), bv=document.getElementById("bval"), box=document.getElementById("scorebox");
    if(s) s.textContent=this.board.score;
    if(bv) bv.textContent=Math.max(this.cfg.highscore,this.board.score);
    if(box && gain>0){ box.querySelectorAll(".plus").forEach(p=>p.remove());
      const p=document.createElement("div"); p.className="plus"; p.textContent="+"+gain; box.appendChild(p);
      setTimeout(()=>p.remove(),700); }
  }
  renderTip(){
    const el=document.getElementById("tiparea"); if(!el) return;
    const t=this.tip;
    if(!t || !this.cfg.show_tips || this.overlayKind()){ el.innerHTML=""; return; }
    el.innerHTML=`<div class="tip ${t.kind}"><span class="dot"></span><span>${this.tipText(t)}</span></div>`;
  }
  changeGrid(delta){ const s=[4,5,6]; let i=s.indexOf(this.cfg.grid_size); i=(i+delta+s.length)%s.length;
    this.cfg.grid_size=s[i]; saveCfg(this.cfg); this.newGame(); }

    document.getElementById("rSettings").onclick=()=>this.showConfirm(L("reset_settings_q"),()=>{
      const hs=this.cfg.highscore; this.cfg=defaultCfg(); this.cfg.highscore=hs; saveCfg(this.cfg); this.newGame(false); this.toast(this.L("done_reset")); this.render(); });
    document.getElementById("rScore").onclick=()=>this.showConfirm(L("reset_score_q"),()=>{
      this.cfg.highscore=0; saveCfg(this.cfg); this.toast(this.L("done_reset")); this.render(); });
    this.app.querySelectorAll(".seg button").forEach(btn=>{ btn.onclick=()=>{ const r=rows[+btn.dataset.r]; r.cb(r.opts[+btn.dataset.o][0]); this.render(); }; });
  }

  // ---------- the refuge (assist configuration) ----------
  enterPreferences(){
    this.profSnapshot=JSON.parse(JSON.stringify(this.cfg.profiles)); this.entryProfile=this.cfg.active_profile;
    this.entryCheatOn=this.activeCheatOn(); this.entryPersist=this.cfg.persist_cheats; this.entryCount=this.cfg.count_cheats_in_best;
    this.cheatDirty=false; this.state="preferences"; this.render();
  }
  enforceMode1Clean(){ if(this.cfg.active_profile===0 && Object.keys(this.cfg.profiles[0].map).length){ this.cfg.profiles[0].map={}; this.cheatDirty=true; } }
  leavePreferences(){
    this.capturing=null; this.closeDialog();
    const nowOn=this.activeCheatOn(), wasOn=this.entryCheatOn, changed=this.cfg.active_profile!==this.entryProfile;
    if(!wasOn && nowOn) this.showConfession();
    else if(wasOn && !nowOn){ saveCfg(this.cfg); this.cheatDirty=false; this.showPraise(); }
    else { if(this.cheatDirty||changed){ saveCfg(this.cfg); this.cheatDirty=false; } this.state="settings"; this.render(); }
  }
  showConfession(){ const L=k=>this.L(k);
    const d=this.dialog(`<h3>${L("confess_title")}</h3><p>${L("confess_body")}</p><p class="accent">${esc(L("confess_line"))}</p>
      <div class="btns"><button class="btn" id="cfYes">${L("confess_yes")}</button><button class="btn accent" id="cfNo">${L("confess_no")}</button></div>`);
    d.querySelector("#cfYes").onclick=()=>{ saveCfg(this.cfg); this.cheatDirty=false; this.closeDialog(); this.state="settings"; this.render(); };
    d.querySelector("#cfNo").onclick=()=>{ this.cfg.profiles=JSON.parse(JSON.stringify(this.profSnapshot)); this.cfg.active_profile=this.entryProfile;
      this.cfg.persist_cheats=this.entryPersist; this.cfg.count_cheats_in_best=this.entryCount; this.cheatDirty=false;
      this.closeDialog(); this.toast(this.L("confess_rejected")); this.state="settings"; this.render(); }; }
  showPraise(){ const L=k=>this.L(k);
    const d=this.dialog(`<div class="check">✓</div><h3 style="color:var(--green)">${L("praise_title")}</h3><p>${L("praise_body")}</p>
      <p style="font-size:13px;color:var(--muted)">${L("praise_body2")}</p><div class="btns"><button class="btn green" id="prOk">${L("praise_ok")}</button></div>`,"green");
    d.querySelector("#prOk").onclick=()=>{ this.closeDialog(); this.toast(this.L("praise_toast")); this.state="settings"; this.render(); }; }
  keyDisplay(k){
    if(!k) return this.L("none");
    if(k.startsWith("zone:")) return this.L("zone_"+k.slice(5))||k;
    return {Shift:"Shift",Control:"Ctrl",Alt:"Alt"," ":"Space",Tab:"Tab"}[k]||(k.length===1?k.toUpperCase():k);
  }
  renderPreferences(){
    const L=k=>this.L(k), rtl=this.isRTL();
    let h=`<div class="screen"><div class="schead"><h1>${L("prefs_title")}</h1><button class="btn" id="pBack">${L("back")}</button></div>
      <div class="refsub">${L("prefs_sub")}</div>
      <div class="modesel"><span class="lbl">${L("game_mode")}</span><button id="pPrev" aria-label="prev">${rtl?ICON.next:ICON.prev}</button>
        <div class="name">${L("mode_names")[this.cfg.active_profile]||("Mode "+(this.cfg.active_profile+1))}</div>
        <button id="pNext" aria-label="next">${rtl?ICON.prev:ICON.next}</button></div>
      <div class="checkrow"><span>${L("persist_cheats")}</span><button class="switch ${this.cfg.persist_cheats?"on":""}" id="cbPersist" role="switch" aria-checked="${this.cfg.persist_cheats}"></button></div>
      <div class="checkrow"><span>${L("count_best")}</span><button class="switch ${this.cfg.count_cheats_in_best?"on":""}" id="cbCount" role="switch" aria-checked="${this.cfg.count_cheats_in_best}"></button></div>
      <div class="sect">${L("assist_keys")}</div>`;
    for(const a of ACTIONS){
      const k=this.keyForAction(a), listening=this.capturing===a;
      h+=`<div class="cheatrow"><div class="info"><div class="t">${L("actions")[a]}<span class="tag ${HOLD.has(a)?"":"tap"}">${HOLD.has(a)?L("hold"):L("tap")}</span></div>
        <div class="d">${L("action_detail")[a]}</div></div>
        <button class="keybox ${listening?"listening":""} ${k?"":"empty"}" data-act="${a}">${listening?L("press_key"):esc(this.keyDisplay(k))}</button></div>`;
    }
    h+=`<div class="clicknote">${IS_TOUCH?L("click_to_set_touch"):L("click_to_set")}</div></div>`;
    this.app.innerHTML=h;
    const $=id=>document.getElementById(id), n=this.cfg.profiles.length;
    $("pBack").onclick=()=>this.leavePreferences();
    $("pPrev").onclick=()=>{ this.cfg.active_profile=(this.cfg.active_profile-1+n)%n; this.enforceMode1Clean(); this.render(); };
    $("pNext").onclick=()=>{ this.cfg.active_profile=(this.cfg.active_profile+1)%n; this.enforceMode1Clean(); this.render(); };
    $("cbPersist").onclick=()=>{ this.cfg.persist_cheats=!this.cfg.persist_cheats; this.cheatDirty=true; this.render(); };
    $("cbCount").onclick=()=>{ this.cfg.count_cheats_in_best=!this.cfg.count_cheats_in_best; this.cheatDirty=true; this.render(); };
    this.app.querySelectorAll(".keybox[data-act]").forEach(box=>{ box.onclick=ev=>{ ev.stopPropagation();
      if(IS_TOUCH){ this.showZonePicker(box.dataset.act); return; }
      this.capturing=box.dataset.act; this.render(); }; });
  }
  captureKey(raw){
    const a=this.capturing;
    if(raw==="Escape"){ this.capturing=null; this.render(); return; }
    if(raw==="Backspace"||raw==="Delete"){ delete this.profile().map[a]; this.cheatDirty=true; this.capturing=null; this.render(); return; }
    if(RESERVED.has(raw)||RESERVED.has(raw.toLowerCase?raw.toLowerCase():raw)){ this.toast(this.L("reserved_key")); return; }
    const k=this.normKey(raw);
    for(const x of Object.keys(this.profile().map)) if(this.profile().map[x]===k) delete this.profile().map[x];
    this.profile().map[a]=k; this.cheatDirty=true; this.capturing=null; this.render();
  }
  showZonePicker(action){
    const L=k=>this.L(k), hold=HOLD.has(action);
    const d=this.dialog(`<h3>${L("choose_zone")}</h3><p style="font-size:13px;color:var(--muted)">${hold?L("zone_hold_hint"):L("zone_tap_hint")}</p>
      <div class="picks">${["tl","tr","bl","br"].map(z=>`<button class="pick" data-z="${z}">${L("zone_"+z)}</button>`).join("")}</div>
      <div class="btns"><button class="btn" id="pkClear">${L("none")}</button><button class="btn accent" id="pkCancel">${L("back")}</button></div>`);
    const assign=z=>{
      if(z===null) delete this.profile().map[action];
      else { const v="zone:"+z; for(const a of ACTIONS) if(a!==action && this.profile().map[a]===v && HOLD.has(a)===hold) delete this.profile().map[a];
        this.profile().map[action]=v; }
      this.cheatDirty=true; this.closeDialog(); this.render();
    };
    d.querySelectorAll(".pick").forEach(b=>b.onclick=()=>assign(b.dataset.z));
    d.querySelector("#pkClear").onclick=()=>assign(null);
    d.querySelector("#pkCancel").onclick=()=>this.closeDialog();
    d.addEventListener("click",ev=>{ if(ev.target===d) this.closeDialog(); });
  }
}

window.addEventListener("load",()=>{
  window._game=new Game();
  // installable + playable offline (the page itself is always fetched fresh first)
  if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="127.0.0.1"||location.hostname==="localhost"))
    navigator.serviceWorker.register("sw.js").catch(()=>{});
});
</script>
</body>
